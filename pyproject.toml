[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nasa-wallpaper"
version = "2.1.0"
description = "Lightweight Windows tray app that sets curated NASA APOD images as wallpaper"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PC BAAZ" }]
dependencies = [
  "requests>=2.31.0",
  "Pillow>=10.0.0",
  "pystray>=0.19.5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0.0"]

[project.scripts]
nasa-wallpaper = "nasa_wallpaper.__main__:main"

[tool.setuptools.packages.find]
include = ["nasa_wallpaper*"]
